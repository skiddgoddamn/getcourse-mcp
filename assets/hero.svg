<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2AABEE"/>
      <stop offset="1" stop-color="#34c759"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="299" rx="16" fill="none" stroke="#30363d"/>

  <!-- title -->
  <text x="40" y="58" fill="#e6edf3" font-size="30" font-weight="700">getcourse-mcp</text>
  <text x="40" y="86" fill="#8b949e" font-size="15">Automate a GetCourse account from an AI agent — access, groups, users</text>
  <rect x="40" y="100" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- pipeline panels -->
  <g transform="translate(40,140)">
    <!-- browser -->
    <rect x="0" y="0" width="270" height="120" rx="12" fill="#0d1117" stroke="#30363d"/>
    <circle cx="20" cy="22" r="4" fill="#ff5f56"/><circle cx="34" cy="22" r="4" fill="#ffbd2e"/><circle cx="48" cy="22" r="4" fill="#27c93f"/>
    <text x="20" y="60" fill="#e6edf3" font-size="15" font-weight="600">Logged-in browser</text>
    <text x="20" y="82" fill="#8b949e" font-size="12.5">Chromium / Yandex · CDP :9222</text>
    <text x="20" y="102" fill="#8b949e" font-size="12.5">carries session cookie + CSRF</text>

    <!-- arrow -->
    <path d="M285 60 h55" stroke="url(#accent)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

    <!-- mcp -->
    <rect x="355" y="0" width="270" height="120" rx="12" fill="#0d1117" stroke="#2AABEE"/>
    <text x="375" y="34" fill="#2AABEE" font-size="15" font-weight="700">MCP server</text>
    <text x="375" y="60" fill="#e6edf3" font-size="12.5">gc_status · gc_find_user</text>
    <text x="375" y="80" fill="#e6edf3" font-size="12.5">gc_list_training_groups</text>
    <text x="375" y="100" fill="#e6edf3" font-size="12.5">gc_check_membership · add_to_groups</text>

    <!-- arrow -->
    <path d="M640 60 h55" stroke="url(#accent)" stroke-width="2.5" fill="none" marker-end="url(#ah)"/>

    <!-- getcourse -->
    <rect x="710" y="0" width="210" height="120" rx="12" fill="#0d1117" stroke="#30363d"/>
    <text x="730" y="34" fill="#e6edf3" font-size="15" font-weight="600">GetCourse</text>
    <text x="730" y="60" fill="#8b949e" font-size="12.5">trainings · lessons</text>
    <text x="730" y="80" fill="#8b949e" font-size="12.5">groups = access</text>
    <text x="730" y="100" fill="#34c759" font-size="12.5">✓ access granted</text>
  </g>

  <defs>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#34c759"/>
    </marker>
  </defs>
</svg>
